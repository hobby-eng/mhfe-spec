name: Verified document PDFs

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: document-pdfs-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
      - name: Build offline and check the finished PDFs
        run: node scripts/build-pdfs.mjs
      - name: Keep the verified deliverables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-pdfs
          path: |
            output/documents/*.pdf
            output/documents/SHA256SUMS
            output/documents/verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Keep conversion evidence for inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-pdf-evidence
          path: output/documents/build-*/
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: document-pdfs
          path: documents
      - name: Attach verified documents to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        working-directory: documents
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" mhfe-specification.pdf mhfe-supplement.pdf SHA256SUMS verification.json
